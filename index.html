<!DOCTYPE html>
<html>

<head>
  <title>Shikha's Website</title>
</head>

<body>

  <main class="welcome-layout">
    <section class="welcome-content">
      <h1>Hi, I'm Shikha!</h1>

      <div class="welcome-row">
        <img src="shikha.jpeg" alt="Shikha" width="300">
        <iframe class="login-frame" src="login.html" title="Login" scrolling="no"></iframe>
      </div>

      <p>Welcome to my website. Thanks for visiting my website!</p>

      <p>This app is all about my chores,how much money I have,and how much my parents owe me!</p>

      <p><a href="./chores/index.html">Open Chores App</a></p>
    </section>
  </main>

  <style>
    :root {
      --ink: #183642;
      --muted-ink: #49636b;
      --paper: rgba(255, 252, 244, 0.9);
      --accent: #d85f45;
      --accent-dark: #9f3d2b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 20px;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.72), transparent 45%),
        linear-gradient(315deg, #f1c98b, #b9e1dc 58%, #f8e8c8);
      font-family: "Palatino Linotype", Palatino, Georgia, serif;
    }

    .welcome-row {
      display: flex;
      align-items: flex-start;
      gap: 32px;
    }

    .welcome-content {
      max-width: 1080px;
      margin: 0 auto;
      padding: clamp(20px, 4vw, 42px);
      background: var(--paper);
      border: 1px solid rgba(24, 54, 66, 0.18);
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(24, 54, 66, 0.16);
    }

    h1 {
      max-width: 650px;
      margin: 0 0 24px;
      font-size: clamp(2.25rem, 6vw, 4.5rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    p {
      max-width: 700px;
      color: var(--muted-ink);
      font-size: 1.08rem;
      line-height: 1.7;
    }

    img {
      width: min(100%, 340px);
      height: 270px;
      object-fit: cover;
      border: 8px solid #fff;
      box-shadow: 10px 10px 0 var(--accent);
      transform: rotate(-2deg);
    }

    a {
      display: inline-block;
      margin: 14px 0;
      color: var(--muted-ink);
      font-size: 1rem;
      line-height: 1.5;
      background: var(--accent-dark);
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: var(--accent);
    }

    .login-frame {
      background: #fff;
      border-color: rgba(24, 54, 66, 0.25);
      box-shadow: 8px 8px 0 rgba(24, 54, 66, 0.12);
    }

    @media (max-width: 700px) {
      body {
        padding: 20px 12px;
      }

      .welcome-row {
        flex-direction: column;
        gap: 32px;
      }

      img {
        height: auto;
        transform: none;
      }

      .login-frame {
        width: 100%;
        max-width: 320px;
      }
    }
  </style>
</body>

</html>
