<div>
   <h2>Login</h2>

<form id="login-form" novalidate>
    <div>
      <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>
    </div>

    <br>

<div>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
</div>

<br>

<button type="submit">Login</button>
<p id="login-message" role="alert"></p>
   
</form>
</div>

<script>
  document.querySelector('#login-form').addEventListener('submit', function (event) {
    event.preventDefault();

    const username = document.querySelector('#username');
    const password = document.querySelector('#password');
    const message = document.querySelector('#login-message');
    const validCredentials = {
      dukku: '#BigSis',
      srijitha: '1',
      rajesh: '1'
    };

    if (!username.value.trim() || !password.value.trim()) {
      message.textContent = 'Please enter both a username and a password.';
      (!username.value.trim() ? username : password).focus();
      return;
    }

    const usernameKey = username.value.trim().toLowerCase();

    if (validCredentials[usernameKey] !== password.value.trim()) {
      message.textContent = 'The username or password is incorrect.';
      username.focus();
      return;
    }

    message.textContent = '';
    window.top.location.href = new URL('./chores/index.html', window.top.location.href).href;
  });
</script>
